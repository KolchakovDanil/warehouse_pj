

services:



  db:
    image: mysql:8.0
    environment:
        MYSQL_ROOT_PASSWORD: root_password
        MYSQL_DATABASE: warehouse
        MYSQL_USER: django_user
        MYSQL_PASSWORD: secure_password
        MYSQL_HOST: '%'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    #command: bash -c "python manage.py migrate && gunicorn sklad_api.wsgi:application --bind 0.0.0.0:8000"
    command: bash -c "wait-for-it db:3306 --timeout=30 -- python manage.py migrate && gunicorn sklad_api.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - app-network
    environment:
      MYSQL_DATABASE: warehouse
      MYSQL_USER: django_user
      MYSQL_PASSWORD: secure_password
      MYSQL_HOST: db  # Или IP-адрес, если нужно

networks:
  app-network:
    driver: bridge
volumes:
  mysql_data: